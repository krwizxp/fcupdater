name: TMP PGO Retrain
on:
  push:
    branches: [tmp/perf-validate]
    paths: [.github/workflows/tmp-pgo-retrain.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retrain:
    name: PGO ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust stable + llvm-tools
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools --no-self-update
          rustc +stable -Vv
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Apply perf patch
        shell: bash
        run: |
          python3 - <<'PY'
          def rep(path, old, new):
              s = open(path, encoding="utf-8").read()
              assert s.count(old) == 1, f"{path}: count={s.count(old)}"
              open(path, "w", encoding="utf-8").write(s.replace(old, new, 1))
          rep("src/diagnostic.rs", "pub(super) fn push_vec<T>(", "#[inline]\npub(super) fn push_vec<T>(")
          rep("src/excel/writer.rs",
              '                    } else {\n                        let span = if cell.inner_xml.starts_with("<f/>") {',
              '                    } else {\n                        if cell.inner_xml.starts_with(follow_xml.as_str()) {\n                            continue;\n                        }\n                        let span = if cell.inner_xml.starts_with("<f/>") {')
          rep("src/excel/writer.rs", "fn col_name_into(", "#[inline]\nfn col_name_into(")
          rep("src/excel/xml.rs",
              "pub(super) fn decode_xml_entities(text: &str) -> Result<Cow<'_, str>> {\n",
              "#[inline]\npub(super) fn decode_xml_entities(text: &str) -> Result<Cow<'_, str>> {\n    if text\n        .bytes()\n        .all(|byte| (0x20..=0x7E).contains(&byte) && !matches!(byte, b'&' | b'<' | b']'))\n    {\n        return Ok(Cow::Borrowed(text));\n    }\n")
          for sig in [
              "    fn read_bits(&mut self, count: u8)",
              "    fn try_peek_bits(&mut self, count: u8)",
              "    fn decode(&self, reader: &mut BitReader<'_>)",
              "    fn insert_position(",
              "fn at<T>(values: &[T], index: usize)",
              "fn at_mut<T>(values: &mut [T], index: usize)",
              "fn hash3(bytes: &[u8], pos: usize)",
          ]:
              ind = "    " if sig.startswith("    ") else ""
              rep("src/excel/zip_archive/deflate.rs", sig, f"{ind}#[inline]\n{sig}")
          rep("src/excel/zip_archive.rs", "fn crc32_table_value(", "#[inline]\nfn crc32_table_value(")
          rep("src/temp_entry.rs",
              '#[cfg(target_os = "windows")]\npub(crate) fn configure_replaceable_file(options: &mut OpenOptions) {\n    options.share_mode(0x0000_0007);\n}\npub(crate) fn open_regular(path: &Path, writable: bool) -> io::Result<ValidatedFile> {\n    let mut opts = File::options();\n    opts.read(true);\n    if writable {\n        opts.write(true);\n        #[cfg(target_os = "windows")]\n        configure_replaceable_file(&mut opts);\n    }\n',
              'pub(crate) fn open_regular(path: &Path) -> io::Result<ValidatedFile> {\n    let mut opts = File::options();\n    opts.read(true);\n')
          rep("src/update_run.rs", "open_regular(self.master_path, false)", "open_regular(self.master_path)")
          s = open("src/excel/xlsx_container.rs", encoding="utf-8").read()
          s = s.replace('#[cfg(target_os = "windows")]\nuse crate::temp_entry::configure_replaceable_file;\n', '', 1)
          s = s.replace(
              'use std::{os::windows::ffi::OsStrExt as _, path::{Component, Prefix, absolute}};',
              'use std::{\n            os::windows::{ffi::OsStrExt as _, fs::OpenOptionsExt as _},\n            path::{Component, Prefix, absolute},\n        };', 1)
          s = s.replace("open_regular(&self.path, false)", "open_regular(&self.path)")
          s = s.replace("open_regular(self.target_xlsx, false)", "open_regular(self.target_xlsx)")
          s = s.replace("open_regular(captured, false)", "open_regular(captured)")
          s = s.replace("configure_replaceable_file(&mut opts);", "opts.share_mode(0x0000_0007);", 1)
          s = s.replace(
              '            let saved = open_regular(self.target_xlsx, true)\n                .map_err(|src| path_err("저장된 xlsx 검증 실패", self.target_xlsx, src))?;\n            (saved.identity == self.temp_archive.identity).ok_or("저장된 xlsx identity 불일치")?;\n            saved\n                .file\n                .sync_all()\n                .map_err(|src| path_err("xlsx sync 실패", self.target_xlsx, src))',
              '            let saved = open_regular(self.target_xlsx)\n                .map_err(|src| path_err("저장된 xlsx 검증 실패", self.target_xlsx, src))?;\n            ensure(\n                saved.identity == self.temp_archive.identity,\n                "저장된 xlsx identity 불일치",\n            )', 1)
          open("src/excel/xlsx_container.rs", "w", encoding="utf-8").write(s)
          PY
      - name: Build instrumented binary
        shell: bash
        run: |
          mkdir -p pgo-raw
          RUSTFLAGS="-Cprofile-generate=$(pwd)/pgo-raw" cargo +stable build --release --frozen --bin fcupdater --target "${{ matrix.target }}" --target-dir target-gen
      - name: Train PGO on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p work-train
          cp fuel_cost_chungcheong.xlsx work-train/fuel_cost_chungcheong.xlsx
          (cd work-train && "../target-gen/${{ matrix.target }}/release/fcupdater" --verify)
      - name: Train PGO on Windows (with bounded TLS restore if needed)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work-train | Out-Null
          Copy-Item fuel_cost_chungcheong.xlsx work-train/fuel_cost_chungcheong.xlsx
          $exe = (Resolve-Path "target-gen/${{ matrix.target }}/release/fcupdater.exe").Path
          Push-Location work-train
          $out = & $exe --verify 2>&1
          $rc = $LASTEXITCODE
          Pop-Location
          if ($rc -ne 0) {
            $suite = "TLS_RSA_WITH_AES_256_GCM_SHA384"
            $origSuites = (Get-TlsCipherSuite).Name
            $regPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Cryptography\Configuration\SSL\00010002'; $hasPolicyFunctions = $false; $origFunctions = $null; $origFunctionsKind = $null; if (Test-Path $regPath) { $k = Get-Item $regPath; if ($null -ne $k.GetValue('Functions', $null)) { $hasPolicyFunctions = $true; $origFunctions = $k.GetValue('Functions'); $origFunctionsKind = $k.GetValueKind('Functions') }; $k.Close() }
            Enable-TlsCipherSuite -Name $suite -Position ([uint32]::MaxValue); if ($hasPolicyFunctions) { if ($origFunctionsKind -eq [Microsoft.Win32.RegistryValueKind]::MultiString) { $arr = @($origFunctions); if ($arr -notcontains $suite) { Set-ItemProperty -Path $regPath -Name 'Functions' -Value ($arr + $suite) -Type MultiString } } else { $s = [string]$origFunctions; $parts = $s -split ',' | Where-Object { $_ -ne '' }; if ($parts -notcontains $suite) { $nv = if ([string]::IsNullOrEmpty($s)) { $suite } elseif ($s.EndsWith(',')) { "$s$suite" } else { "$s,$suite" }; Set-ItemProperty -Path $regPath -Name 'Functions' -Value $nv -Type $origFunctionsKind } } }
            try {
              Copy-Item fuel_cost_chungcheong.xlsx work-train/fuel_cost_chungcheong.xlsx -Force
              Push-Location work-train
              & $exe --verify
              if ($LASTEXITCODE -ne 0) { throw "fcupdater --verify failed even with $suite" }
              Pop-Location
            } finally {
              Disable-TlsCipherSuite -Name $suite; if ($hasPolicyFunctions) { Set-ItemProperty -Path $regPath -Name 'Functions' -Value $origFunctions -Type $origFunctionsKind }; if ((Get-Location).Path -like '*work-train*') { Pop-Location }
            }
            $restored = (Get-TlsCipherSuite).Name
            if (($origSuites -join ',') -ne ($restored -join ',')) { throw "TLS cipher suite restoration mismatch" }
          }
      - name: Merge profdata & verify build-pgo
        shell: bash
        run: |
          PROFDATA="$(rustc +stable --print target-libdir)/../bin/llvm-profdata"
          "$PROFDATA" merge -o "pgo/${{ matrix.target }}.profdata" pgo-raw
          cargo +stable build-pgo 2>&1 | tee pgo-build.log
          ext=""
          [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          sz=$(wc -c < "target/${{ matrix.target }}/release/fcupdater${ext}")
          sha=$(sha256sum "pgo/${{ matrix.target }}.profdata" | awk '{print $1}')
          warns=$(grep -c "hash mismatch" pgo-build.log || true)
          echo "### PGO ${{ matrix.os }} (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- profdata sha256: \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- PGO release binary: ${sz} B, hash-mismatch warnings: ${warns}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fresh profdata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pgo-${{ matrix.target }}
          path: pgo/${{ matrix.target }}.profdata
          archive: false
          if-no-files-found: error
          retention-days: 14
