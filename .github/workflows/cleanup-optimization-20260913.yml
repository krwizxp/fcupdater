name: Cleanup verified optimization branches
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-optimization-20260913.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify optimization commit is integrated
        run: git merge-base --is-ancestor 660ee83ceb8d2ac194f5af5e0c50c3739468a26d HEAD
      - name: Configure repository authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh auth setup-git --hostname github.com
      - name: Delete the verified temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push origin --force-with-lease=refs/heads/optimize/20260913-validation:660ee83ceb8d2ac194f5af5e0c50c3739468a26d :refs/heads/optimize/20260913-validation
