name: Goal round 2 cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/goal-round2-cleanup-20260920.yml]
permissions: {}
jobs:
  cleanup:
    if: github.repository == 'krwizxp/fcupdater' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Delete verified temporary branch, runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          CLEANUP_REPOSITORY: krwizxp/fcupdater
          CLEANUP_BRANCH: codex/goal-round2-20260920
          CLEANUP_SOURCE_SHA: 6d30b4f24ff802a12841042940c97089f376390a
          CLEANUP_MERGED_SHA: a57a23d9e8bf625d433ac915ab317eb01f189b31
          CLEANUP_CI_ID: "35488408204"
          CLEANUP_RUNS: '[[35488017307,"6d30b4f24ff802a12841042940c97089f376390a"]]'
        run: python3 .github/validation/round2-cleanup.py
