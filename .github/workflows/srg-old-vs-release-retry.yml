name: Retry only stalled Windows SRG PGO direct-comparison shard
on:
  push:
    branches: [codex/srg-old-pgo-vs-release-retry-20261010]
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: '1'
  PATTERN_TARGET: x86_64-pc-windows-msvc
jobs:
  compare:
    name: Windows SRG direct old PGO versus release / fixed shard 3
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: fcupdater
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: windows-srg-prepared
          run-id: 38015039181
          github-token: ${{ github.token }}
          path: fcupdater/validation-patterns/prepared
      - run: python -m pip install pywinpty
      - name: Repeat only shard 3 (same seed, two fixed binaries, four pairs)
        working-directory: fcupdater
        env:
          SRG_COMPARE_PHASE: measure
          SRG_COMPARE_SHARD: 3
        run: python validation-patterns/compare_old_release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: srg-direct-old-vs-release-shard-3-retry
          path: fcupdater/validation-patterns/direct-results/shard-3/results.json
          retention-days: 7
