name: Temporary workbook behavior regression
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/workbook-regression-temporary.yml"
      - ".validation/fcupdater-regressions.py"
      - "src/**"
      - "fuel_cost_chungcheong.xlsx"
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Resolve latest stable compiler
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustc +stable -Vv
      - name: Install native libcurl
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Strict TLS actual Opinet HTTPS preflight
        run: |
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output /dev/null --write-out "Opinet HTTPS status %{http_code}\n" https://www.opinet.co.kr/user/opdown/opDownload.do
      - name: Build production PGO release
        run: cargo +stable build-pgo
      - name: Prepare isolated edge-case and rejected-input fixtures
        run: |
          python3 - <<'PY'
          import runpy
          import shutil
          from pathlib import Path
          module = runpy.run_path(".validation/fcupdater-regressions.py")
          source = Path("fuel_cost_chungcheong.xlsx")
          dest = Path(".validation/fixtures")
          dest.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(source,dest/"default.xlsx")
          for filename,controls in [
              ("premium.xlsx",{"B4":0}),
              ("gasoline.xlsx",{"B5":0}),
              ("zero.xlsx",{"B4":0,"B5":0}),
              ("large.xlsx",{"B4":2147483647,"B5":2147483647}),
          ]:
              module["change_controls"](source,dest/filename,controls)
          module["change_controls"](source,dest/"badformula.xlsx",invalid_formula=True)
          (dest/"badzip.xlsx").write_bytes(b"not a valid ZIP")
          (dest/"symlink.xlsx").symlink_to("default.xlsx")
          with Path("src/excel/writer.rs").open("a") as stream:
              stream.write('\ninclude!("../../.validation/octane-regressions.rs");\n')
          PY
      - name: Run independent deterministic octane, malformed container and symlink regressions
        run: cargo +stable test --all-targets --frozen -- --nocapture
      - name: Exercise CLI and one real authoritative Opinet verified refresh
        env:
          FCUPDATER_RELEASE_BINARY: ${{ github.workspace }}/target/x86_64-unknown-linux-gnu/release/fcupdater
        run: python3 .validation/fcupdater-regressions.py
