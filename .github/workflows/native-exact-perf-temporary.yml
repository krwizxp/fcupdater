name: Temporary four-platform exact-baseline native performance
on:
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Refresh and pin current latest stable Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustc +stable -Vv
      - name: Install platform-native native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Provision fixed-version memory observation module
        run: python -m pip install --disable-pip-version-check psutil==7.1.1
      - name: Compare exact baseline, current main and newly trained PGO candidate using interleaved native measurements
        env:
          NATIVE_TARGET: ${{ matrix.target }}
        run: python .validation/native-exact-perf.py
      - name: Upload reproducible native performance measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-exact-baseline-${{ matrix.target }}
          path: .validation/native-baseline-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 7
