name: Native PGO retraining for Rust 1.99.1 (temporary)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pgo-retrain.yml"
permissions:
  contents: read
jobs:
  train:
    name: Train ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1 and matched llvm-profdata
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview --no-self-update
      - name: Install Linux libcurl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Instrument, train, merge, and validate release PGO
        shell: bash
        run: python .pgo-retrain/train.py "${{ matrix.target }}"
      - name: Upload target-specific profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pgo-${{ matrix.target }}
          path: .pgo-retrain/out/${{ matrix.target }}.profdata
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Commit four verified profiles and remove temporary tooling
    needs: train
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pgo-*
          path: .pgo-retrain/download
          merge-multiple: true
      - name: Verify all four profiles, publish only profiles, clean temporary scripts
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            test -s ".pgo-retrain/download/${target}.profdata"
            cp ".pgo-retrain/download/${target}.profdata" "pgo/${target}.profdata"
          done
          git diff --check
          if git diff --quiet -- pgo; then echo "No profile changes"; exit 1; fi
          git add pgo/*.profdata
          git rm .github/workflows/pgo-retrain.yml .pgo-retrain/train.py .pgo-retrain/probe.rs .pgo-retrain/writer_probe.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate four PGO profiles using Rust 1.99.1"
          git push origin HEAD:main
