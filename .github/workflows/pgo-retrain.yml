name: Native PGO retraining for Rust 1.99.1 (temporary)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pgo-retrain.yml"
permissions:
  contents: read
jobs:
  train:
    name: Train ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.1 and matched llvm-profdata
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component llvm-tools-preview --no-self-update
      - name: Install Linux libcurl development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Instrument, train, merge, and validate release PGO
        shell: bash
        run: python .pgo-retrain/train.py "${{ matrix.target }}"
      - name: Upload target-specific profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pgo-${{ matrix.target }}
          path: .pgo-retrain/out/${{ matrix.target }}.profdata
          if-no-files-found: error
          retention-days: 14
      - name: Upload independently verified Opinet-updated workbook
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: opi-net-refreshed-workbook
          path: .pgo-retrain/out/fuel_cost_chungcheong.xlsx
          if-no-files-found: error
          retention-days: 14
  publish:
    name: Commit four verified profiles and remove temporary tooling
    needs: train
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          pattern: pgo-*
          path: .pgo-retrain/download
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: opi-net-refreshed-workbook
          path: .pgo-retrain/download
      - name: Verify four profiles and Opinet workbook, publish together, clean temporary scripts
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc; do
            test -s ".pgo-retrain/download/${target}.profdata"
            cp ".pgo-retrain/download/${target}.profdata" "pgo/${target}.profdata"
          done
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from zipfile import ZipFile
          p = Path(".pgo-retrain/download/fuel_cost_chungcheong.xlsx")
          assert p.is_file() and p.stat().st_size > 100000
          with ZipFile(p) as z:
              assert z.testzip() is None
              ns = "{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
              book = ET.fromstring(z.read("xl/workbook.xml"))
              assert [s.attrib["name"] for s in book.iter(ns + "sheet")] == ["유류비", "변경내역"]
              data = ET.fromstring(z.read("xl/worksheets/sheet1.xml"))
              assert sum(1 for _ in data.iter(ns + "row")) >= 800
              assert any(True for _ in data.iter(ns + "f"))
              ET.fromstring(z.read("xl/worksheets/sheet2.xml"))
          PY
          cp ".pgo-retrain/download/fuel_cost_chungcheong.xlsx" "fuel_cost_chungcheong.xlsx"
          git diff --check
          if git diff --quiet -- pgo; then echo "No profile changes"; exit 1; fi
          if git diff --quiet -- fuel_cost_chungcheong.xlsx; then echo "Workbook did not refresh"; exit 1; fi
          git add pgo/*.profdata fuel_cost_chungcheong.xlsx
          git rm .github/workflows/pgo-retrain.yml .pgo-retrain/train.py .pgo-retrain/probe.rs .pgo-retrain/writer_probe.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Opinet workbook and four Rust 1.99.1 PGO profiles"
          git push origin HEAD:main
