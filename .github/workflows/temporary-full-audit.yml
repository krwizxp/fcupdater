name: Temporary full audit
on:
  push:
    branches:
      - validation/full-audit-20261031-gpt6
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    name: Rust Linux lint format tests release
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --no-self-update
      - name: Toolchain identity
        run: rustc +1.99.1 -Vv
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Format
        run: cargo +1.99.1 fmt --all -- --check
      - name: Clippy strict
        run: cargo +1.99.1 clippy --all-targets --frozen -- -D warnings
      - name: Test
        run: cargo +1.99.1 test --frozen
      - name: Release
        run: cargo +1.99.1 build-pgo
