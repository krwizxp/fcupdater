name: Apply fuel workbook update once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-fuel-workbook-once.yml

permissions:
  contents: write

concurrency:
  group: apply-fuel-workbook-once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev

      - name: Generate updated workbook
        run: cargo +stable run --release --frozen -- --verify

      - name: Install workbook verifier
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Verify workbook semantic digest
        env:
          EXPECTED_DIGEST: 7c6c6b7eb735123d3e54cb4a67121112ab1abceb1314c902b024caea4a00ac77
        run: |
          cat > /tmp/workbook_semantic_digest.py <<'PY'
          import hashlib, json, sys
          from datetime import date, datetime, time
          from openpyxl import load_workbook

          def norm(v):
              if v is None or isinstance(v, (str, int, bool)):
                  return v
              if isinstance(v, float):
                  if v != v:
                      return 'NaN'
                  if v == float('inf'):
                      return 'Infinity'
                  if v == float('-inf'):
                      return '-Infinity'
                  return repr(v)
              if isinstance(v, (datetime, date, time)):
                  return v.isoformat()
              return str(v)

          def digest(path):
              wb = load_workbook(path, data_only=False, read_only=False, keep_links=True)
              out = {
                  'sheetnames': wb.sheetnames,
                  'date1904': bool(getattr(wb, 'epoch', None) and '1904' in str(wb.epoch)),
                  'defined_names': sorted(str(x) for x in wb.defined_names.values()),
                  'sheets': [],
              }
              for ws in wb.worksheets:
                  sheet = {
                      'title': ws.title,
                      'state': ws.sheet_state,
                      'freeze_panes': str(ws.freeze_panes) if ws.freeze_panes else None,
                      'merged': sorted(str(r) for r in ws.merged_cells.ranges),
                      'auto_filter': ws.auto_filter.ref,
                      'row_dims': [],
                      'col_dims': [],
                      'cells': [],
                      'print_area': str(ws.print_area) if ws.print_area else None,
                      'print_title_rows': ws.print_title_rows,
                      'print_title_cols': ws.print_title_cols,
                      'sheet_view': {
                          'showGridLines': ws.sheet_view.showGridLines,
                          'zoomScale': ws.sheet_view.zoomScale,
                          'zoomScaleNormal': ws.sheet_view.zoomScaleNormal,
                      },
                      'page_setup': {
                          'orientation': ws.page_setup.orientation,
                          'paperSize': ws.page_setup.paperSize,
                          'fitToWidth': ws.page_setup.fitToWidth,
                          'fitToHeight': ws.page_setup.fitToHeight,
                          'scale': ws.page_setup.scale,
                      },
                      'page_margins': {
                          'left': ws.page_margins.left,
                          'right': ws.page_margins.right,
                          'top': ws.page_margins.top,
                          'bottom': ws.page_margins.bottom,
                          'header': ws.page_margins.header,
                          'footer': ws.page_margins.footer,
                      },
                  }
                  for idx, dim in sorted(ws.row_dimensions.items()):
                      if any(x is not None for x in (dim.height, dim.hidden, dim.outlineLevel, dim.style_id)):
                          sheet['row_dims'].append([idx, dim.height, dim.hidden, dim.outlineLevel, dim.style_id])
                  for key, dim in sorted(ws.column_dimensions.items()):
                      sheet['col_dims'].append([key, dim.min, dim.max, dim.width, dim.hidden, dim.outlineLevel, dim.style])
                  for (row, col), cell in sorted(ws._cells.items()):
                      if cell.value is None and not cell.has_style and cell.comment is None and cell.hyperlink is None:
                          continue
                      style = cell._style
                      sheet['cells'].append({
                          'r': row,
                          'c': col,
                          'v': norm(cell.value),
                          't': cell.data_type,
                          'style': list(style) if style is not None else None,
                          'numfmt': cell.number_format,
                          'comment': None if cell.comment is None else [cell.comment.text, cell.comment.author],
                          'hyperlink': None if cell.hyperlink is None else [cell.hyperlink.target, cell.hyperlink.location, cell.hyperlink.tooltip],
                      })
                  out['sheets'].append(sheet)
              payload = json.dumps(out, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              return hashlib.sha256(payload).hexdigest()

          actual = digest('fuel_cost_chungcheong.xlsx')
          print(f'Workbook semantic digest: {actual}')
          if actual != __import__('os').environ['EXPECTED_DIGEST']:
              raise SystemExit('Generated workbook does not match the uploaded workbook')
          PY
          python3 /tmp/workbook_semantic_digest.py

      - name: Commit workbook and remove one-shot workflow
        run: |
          rm .github/workflows/apply-fuel-workbook-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add fuel_cost_chungcheong.xlsx .github/workflows/apply-fuel-workbook-once.yml
          git commit -m "Update Chungcheong fuel cost workbook"
          git push origin HEAD:main
