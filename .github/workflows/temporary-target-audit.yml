name: Temporary native-target audit
on:
  push:
    branches:
      - validation/full-audit-20261031-gpt6
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.os }} native strict checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-26-intel, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy --no-self-update
      - name: Toolchain and native architecture
        shell: bash
        run: |
          rustc +1.99.1 -Vv
          uname -s -m || true
          echo "RUNNER_OS=$RUNNER_OS RUNNER_ARCH=$RUNNER_ARCH"
      - name: Format
        run: cargo +1.99.1 fmt --all -- --check
      - name: Clippy strict
        run: cargo +1.99.1 clippy --all-targets --frozen -- -D warnings
      - name: Test
        run: cargo +1.99.1 test --frozen
      - name: Release
        run: cargo +1.99.1 build-pgo
