name: Optimization native validation
on:
  push:
    branches:
      - codex/optimization-validation-20261011
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / latest stable Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Use the latest GA Ubuntu image without waiting for ubuntu-latest migration.
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            binary_name: fcupdater-linux-x64
          - os: macos-26-intel
            target: x86_64-apple-darwin
            binary_name: fcupdater-macos-x64
          - os: macos-26
            target: aarch64-apple-darwin
            binary_name: fcupdater-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: fcupdater-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install optimization-cycle Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Native builds, behavior, profiles, and actual packages
        run: python .optimization-validation/native_validation.py --repo fcupdater --target "${{ matrix.target }}" --binary-name "${{ matrix.binary_name }}"
      - name: Upload reproducible native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: optimization-${{ matrix.target }}
          path: optimization-native-results/
          if-no-files-found: error
          retention-days: 14
