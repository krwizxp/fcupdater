name: Optimization validation 20261013
on:
  push:
    branches: [codex/optimization-validation-20261013]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  native:
    name: Native / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned native Rust
        run: rustup toolchain install 1.99.0-${{ matrix.target }} --profile minimal --component rustfmt --component clippy --component llvm-tools-preview --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Compare immutable baseline and candidate
        run: python .optimization-validation/native_validation.py --repo fcupdater --target "${{ matrix.target }}" --name "fcupdater-${{ matrix.target }}"
      - name: Upload measurement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-fcupdater-${{ matrix.target }}
          path: optimization-native-results/
          if-no-files-found: warn
          retention-days: 14
