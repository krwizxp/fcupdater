name: CI
on:
  push:
    branches:
      - main
    tags:
      - "*"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.os }} / latest stable Rust
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary_name: fcupdater-linux-x64
          - os: macos-26-intel
            binary_name: fcupdater-macos-x64
          - os: macos-26
            binary_name: fcupdater-macos-arm64
          - os: windows-latest
            binary_name: fcupdater-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Build Release Binary
        run: cargo +stable build --release --frozen --bin fcupdater
      - name: Prepare binary artifact with Rust
        run: cargo +stable run --frozen --example package_artifact -- "${{ matrix.binary_name }}"
      - name: Upload Binary Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: artifacts/${{ matrix.binary_name }}.*
          archive: false
          if-no-files-found: error
          retention-days: 14
