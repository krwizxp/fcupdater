name: Goal final workbook refresh
on:
  push:
    branches: [codex/goal-refresh-20260919]
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.98.1 --profile minimal --no-self-update
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - run: cargo +1.98.1 build --release --frozen
      - name: Update with storage verification
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v ./target/release/fcupdater --verify 2>&1 | tee workbook-refresh.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: goal-final-workbook-20260919
          path: |
            fuel_cost_chungcheong.xlsx
            workbook-refresh.log
          if-no-files-found: error
          retention-days: 1
