name: Update Master Excel
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-master
  cancel-in-progress: true
jobs:
  update:
    # Match the Linux image used by CI.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Run updater
        run: |
          cargo +stable build-pgo
          ./target/x86_64-unknown-linux-gnu/release/fcupdater --verify
      - name: Mark newly added Daejeon Hansol station as local currency eligible
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          import openpyxl
          path = Path("fuel_cost_chungcheong.xlsx")
          book = openpyxl.load_workbook(path, read_only=True)
          sheet = book["유류비"]
          changes = book["변경내역"]
          matches = [row[0].row for row in sheet.iter_rows(min_row=15, max_col=3) if row[1].value == "대전" and row[2].value == "한솔주유소"]
          assert len(matches) <= 1, matches
          if matches:
              row = matches[0]
              address = sheet[f"F{row}"].value
              assert any(c[1].value == "한솔주유소" and c[2].value == address and c[3].value == "신규" for c in changes.iter_rows(min_row=2, max_col=4))
              old = f'<c r="Q{row}" s="12"/>'.encode()
              new = f'<c r="Q{row}" s="12" t="inlineStr"><is><t>Y</t></is></c>'.encode()
              temp = path.with_suffix(".tmp")
              with ZipFile(path) as source, ZipFile(temp, "w") as output:
                  for item in source.infolist():
                      data = source.read(item.filename)
                      if item.filename == "xl/worksheets/sheet1.xml":
                          assert data.count(old) == 1
                          data = data.replace(old, new)
                      output.writestr(item, data)
              temp.replace(path)
              assert openpyxl.load_workbook(path, read_only=True)["유류비"][f"Q{row}"].value == "Y"
          PY
      - name: Commit refreshed workbook to validation branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel_cost_chungcheong.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Refresh master workbook with verified Opinet data"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: fuel_cost_chungcheong.xlsx
          archive: false
          if-no-files-found: error
          retention-days: 14
