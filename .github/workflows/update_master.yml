name: Update Master Excel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-master
  cancel-in-progress: true
jobs:
  update:
    # Match the Linux image used by CI.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --no-self-update
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Run updater
        run: |
          cargo +1.99.0 build-pgo
          ./target/x86_64-unknown-linux-gnu/release/fcupdater --verify
      - name: Upload result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: fuel_cost_chungcheong.xlsx
          archive: false
          if-no-files-found: error
          retention-days: 14
