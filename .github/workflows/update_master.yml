name: Update Master Excel
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-master
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install latest stable Rust
        run: rustup toolchain install stable --profile minimal --no-self-update
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Run updater
        run: cargo +stable run --release --frozen -- --verify
      - name: Upload result artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: fuel_cost_chungcheong.xlsx
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Commit refreshed workbook and restore workflow
        run: |
          git checkout HEAD^ -- .github/workflows/update_master.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel_cost_chungcheong.xlsx .github/workflows/update_master.yml
          git diff --cached --quiet || git commit -m "Refresh fuel cost workbook"
          git push origin HEAD:main
