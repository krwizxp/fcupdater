name: TMP Perf Validate
on:
  push:
    branches: [tmp/perf-validate]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update
          rustc +stable -Vv
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Build baseline release
        shell: bash
        run: cargo +stable build --release --frozen --target "${{ matrix.target }}" --target-dir target-base
      - name: Apply perf patch
        shell: bash
        run: |
          python3 - <<'PY'
          def rep(path, old, new):
              s = open(path, encoding="utf-8").read()
              assert s.count(old) == 1, f"{path}: count={s.count(old)}"
              open(path, "w", encoding="utf-8").write(s.replace(old, new, 1))
          rep("src/diagnostic.rs", "pub(super) fn push_vec<T>(", "#[inline]\npub(super) fn push_vec<T>(")
          rep("src/excel/writer.rs",
              '                    } else {\n                        let span = if cell.inner_xml.starts_with("<f/>") {',
              '                    } else {\n                        if cell.inner_xml.starts_with(follow_xml.as_str()) {\n                            continue;\n                        }\n                        let span = if cell.inner_xml.starts_with("<f/>") {')
          rep("src/excel/writer.rs", "fn col_name_into(", "#[inline]\nfn col_name_into(")
          rep("src/excel/xml.rs",
              "pub(super) fn decode_xml_entities(text: &str) -> Result<Cow<'_, str>> {\n",
              "#[inline]\npub(super) fn decode_xml_entities(text: &str) -> Result<Cow<'_, str>> {\n    if text\n        .bytes()\n        .all(|byte| (0x20..=0x7E).contains(&byte) && !matches!(byte, b'&' | b'<' | b']'))\n    {\n        return Ok(Cow::Borrowed(text));\n    }\n")
          for sig in [
              "    fn read_bits(&mut self, count: u8)",
              "    fn try_peek_bits(&mut self, count: u8)",
              "    fn decode(&self, reader: &mut BitReader<'_>)",
              "    fn insert_position(",
              "fn at<T>(values: &[T], index: usize)",
              "fn at_mut<T>(values: &mut [T], index: usize)",
              "fn hash3(bytes: &[u8], pos: usize)",
          ]:
              ind = "    " if sig.startswith("    ") else ""
              rep("src/excel/zip_archive/deflate.rs", sig, f"{ind}#[inline]\n{sig}")
          rep("src/excel/zip_archive.rs", "fn crc32_table_value(", "#[inline]\nfn crc32_table_value(")
          rep("src/temp_entry.rs",
              '#[cfg(target_os = "windows")]\npub(crate) fn configure_replaceable_file(options: &mut OpenOptions) {\n    options.share_mode(0x0000_0007);\n}\npub(crate) fn open_regular(path: &Path, writable: bool) -> io::Result<ValidatedFile> {\n    let mut opts = File::options();\n    opts.read(true);\n    if writable {\n        opts.write(true);\n        #[cfg(target_os = "windows")]\n        configure_replaceable_file(&mut opts);\n    }\n',
              'pub(crate) fn open_regular(path: &Path) -> io::Result<ValidatedFile> {\n    let mut opts = File::options();\n    opts.read(true);\n')
          rep("src/update_run.rs", "open_regular(self.master_path, false)", "open_regular(self.master_path)")
          s = open("src/excel/xlsx_container.rs", encoding="utf-8").read()
          s = s.replace('#[cfg(target_os = "windows")]\nuse crate::temp_entry::configure_replaceable_file;\n', '', 1)
          s = s.replace(
              'use std::{os::windows::ffi::OsStrExt as _, path::{Component, Prefix, absolute}};',
              'use std::{\n            os::windows::{ffi::OsStrExt as _, fs::OpenOptionsExt as _},\n            path::{Component, Prefix, absolute},\n        };', 1)
          s = s.replace("open_regular(&self.path, false)", "open_regular(&self.path)")
          s = s.replace("open_regular(self.target_xlsx, false)", "open_regular(self.target_xlsx)")
          s = s.replace("open_regular(captured, false)", "open_regular(captured)")
          s = s.replace("configure_replaceable_file(&mut opts);", "opts.share_mode(0x0000_0007);", 1)
          s = s.replace(
              '            let saved = open_regular(self.target_xlsx, true)\n                .map_err(|src| path_err("저장된 xlsx 검증 실패", self.target_xlsx, src))?;\n            (saved.identity == self.temp_archive.identity).ok_or("저장된 xlsx identity 불일치")?;\n            saved\n                .file\n                .sync_all()\n                .map_err(|src| path_err("xlsx sync 실패", self.target_xlsx, src))',
              '            let saved = open_regular(self.target_xlsx)\n                .map_err(|src| path_err("저장된 xlsx 검증 실패", self.target_xlsx, src))?;\n            ensure(\n                saved.identity == self.temp_archive.identity,\n                "저장된 xlsx identity 불일치",\n            )', 1)
          open("src/excel/xlsx_container.rs", "w", encoding="utf-8").write(s)
          PY
      - name: Format, Clippy, Test, Release Build
        shell: bash
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --all-targets --target "${{ matrix.target }}" -- -D warnings
          cargo +stable test --target "${{ matrix.target }}"
          cargo +stable build --release --frozen --target "${{ matrix.target }}" --target-dir target-cand
          ext=""
          [[ "${{ runner.os }}" == "Windows" ]] && ext=".exe"
          b_sz=$(wc -c < "target-base/${{ matrix.target }}/release/fcupdater${ext}")
          c_sz=$(wc -c < "target-cand/${{ matrix.target }}/release/fcupdater${ext}")
          echo "### ${{ matrix.os }} (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Binary size: ${b_sz} -> ${c_sz} B ($((c_sz - b_sz)) B)" >> "$GITHUB_STEP_SUMMARY"
          echo "- fmt / clippy -D warnings / test / release: PASS" >> "$GITHUB_STEP_SUMMARY"
