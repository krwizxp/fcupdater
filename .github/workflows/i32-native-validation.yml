name: Temporary i32 native validation
on:
  push:
    branches:
      - codex/i32-option-20261011
permissions:
  contents: read
concurrency:
  group: i32-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install fixed cycle Rust and tools
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --component llvm-tools --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Install validation-only Python readers
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 psutil==7.0.0
      - name: Native baseline and candidate validation
        env:
          OPT_TARGET: ${{ matrix.target }}
        run: python validation-i32/native_validate.py
      - name: Save native evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: i32-native-${{ matrix.target }}
          path: validation-i32/evidence/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
