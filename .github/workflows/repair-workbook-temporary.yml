name: Temporary workbook shared string repair
on:
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p = Path("fuel_cost_chungcheong.xlsx")
          temp = p.with_suffix(".tmp")
          with ZipFile(p) as source:
              root = ET.fromstring(source.read("xl/sharedStrings.xml"))
              ns = "{http://schemas.openxmlformats.org/spreadsheetml/2006/main}"
              strings = ["".join(t.text or "" for t in si.iter(ns + "t")) for si in root.findall(ns + "si")]
              assert strings.count("Y") == 1
              index = strings.index("Y")
              with ZipFile(temp, "w") as output:
                  for item in source.infolist():
                      data = source.read(item.filename)
                      if item.filename == "xl/worksheets/sheet1.xml":
                          old = b'<c r="Q876" s="12" t="inlineStr"><is><t>Y</t></is></c>'
                          new = f'<c r="Q876" s="12" t="s"><v>{index}</v></c>'.encode()
                          assert data.count(old) == 1
                          data = data.replace(old, new)
                      output.writestr(item, data)
          temp.replace(p)
          with ZipFile(p) as z:
              assert z.testzip() is None
              data = z.read("xl/worksheets/sheet1.xml")
              assert f'<c r="Q876" s="12" t="s"><v>{index}</v></c>'.encode() in data
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel_cost_chungcheong.xlsx
          git commit -m "Use shared string for Hansol local currency flag"
          git push origin HEAD:${{ github.head_ref }}
