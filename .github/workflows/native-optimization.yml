name: Temporary native optimization validation
on:
  push:
    branches: [codex/fcupdater-optimize-20261010]
permissions:
  contents: read
jobs:
  native:
    name: ${{ matrix.target }} optimization comparison
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust compiler and checks
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt --component llvm-tools-preview --no-self-update
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Refresh Microsoft trusted roots for native HTTPS validation
        if: runner.os == 'Windows'
        run: |
          certutil -generateSSTFromWU validation-optimization/roots.sst
          if ($LASTEXITCODE -ne 0) { throw "Microsoft trusted root download failed" }
          certutil -user -addstore -f Root validation-optimization/roots.sst
          if ($LASTEXITCODE -ne 0) { throw "Microsoft trusted root import failed" }
      - name: Install independent workbook reader and memory sampler
        run: |
          python3 -m venv validation-optimization/.venv
          python3 -c "import os,subprocess; py='validation-optimization/.venv/'+('Scripts/python.exe' if os.name=='nt' else 'bin/python'); subprocess.check_call([py,'-m','pip','install','openpyxl==3.1.5','psutil==7.1.3'])"
      - name: Native builds, PGO training and protected-metric comparison
        env:
          OPT_TARGET: ${{ matrix.target }}
        run: |
          python3 -c "import os,subprocess; py='validation-optimization/.venv/'+('Scripts/python.exe' if os.name=='nt' else 'bin/python'); subprocess.check_call([py,'validation-optimization/native_validate.py'])"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fcupdater-optimization-${{ matrix.target }}
          path: validation-optimization/evidence/${{ matrix.target }}
          retention-days: 14
