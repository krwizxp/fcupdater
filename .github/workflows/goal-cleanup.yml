name: Cleanup completed Goal verification
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/goal-cleanup.yml
permissions:
  contents: write
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove completed temporary run 34924544926
        run: gh api --method DELETE repos/krwizxp/fcupdater/actions/runs/34924544926
      - name: Remove verified temporary branch
        run: gh api --method DELETE repos/krwizxp/fcupdater/git/refs/heads/optimize/goal-20260915-native
