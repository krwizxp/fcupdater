name: Temporary macOS PGO retraining
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pgo-retrain-temporary.yml"
      - "src/**"
permissions:
  contents: write
jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
      - name: Train with the real updater
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pgo" "$RUNNER_TEMP/work"
          RUSTFLAGS="-Cprofile-generate=$RUNNER_TEMP/pgo" cargo +stable build --release --frozen --bin fcupdater --target ${{ matrix.target }}
          cp fuel_cost_chungcheong.xlsx "$RUNNER_TEMP/work/"
          cd "$RUNNER_TEMP/work"
          "$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/fcupdater" --verify
          cd "$GITHUB_WORKSPACE"
          LLVM_PROFDATA="$(rustc +stable --print sysroot)/lib/rustlib/${{ matrix.target }}/bin/llvm-profdata"
          "$LLVM_PROFDATA" merge -o "${{ matrix.target }}.profdata" "$RUNNER_TEMP"/pgo/*.profraw
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: profile-${{ matrix.target }}
          path: ${{ matrix.target }}.profdata
          if-no-files-found: error
  commit:
    needs: train
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: profile-*
          merge-multiple: true
          path: pgo
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgo/x86_64-apple-darwin.profdata pgo/aarch64-apple-darwin.profdata
          git commit -m "Regenerate macOS PGO profiles from live updater" 
          git push origin HEAD:${{ github.head_ref }}
