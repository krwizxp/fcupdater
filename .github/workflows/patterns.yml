name: Temporary real-use PGO relearning
on:
  push:
    branches: [codex/pgo-patterns-20261010]
permissions:
  contents: read
  actions: read
env:
  PYTHONUTF8: "1"
  PATTERN_TARGET: x86_64-pc-windows-msvc
jobs:
  train:
    name: Reuse byte-identical trained Windows SRG product
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: windows-srg-prepared
          run-id: 38013902564
          github-token: ${{ github.token }}
          path: prepared
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-srg-prepared
          path: prepared
          retention-days: 3
  measure:
    needs: train
    name: Windows SRG paired comparison / ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        group: [features, menu, full-0, full-1, full-2, full-3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: fcupdater
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: windows-srg-prepared
          path: fcupdater/validation-patterns/prepared
      - run: python -m pip install pywinpty
      - name: Measure unchanged release executables on paired native inputs
        working-directory: fcupdater
        env:
          PATTERN_PHASE: measure
          PATTERN_GROUP: ${{ matrix.group }}
        run: python validation-patterns/split_patterns.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-srg-part-${{ matrix.group }}
          path: fcupdater/validation-patterns/evidence/x86_64-pc-windows-msvc/results.json
          retention-days: 3
  combine:
    needs: measure
    name: Windows SRG exact evidence and unchanged product package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: fcupdater
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: krwizxp/srg
          ref: 5be8df3c960ebc601c7bfb815d2aae7c90911088
          persist-credentials: false
          path: srg
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: windows-srg-prepared
          path: fcupdater/validation-patterns/prepared
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: windows-srg-part-*
          path: fcupdater/validation-patterns/parts
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview --no-self-update
      - name: Verify fixed denominator and compute the original acceptance criteria
        working-directory: fcupdater
        env:
          PATTERN_PHASE: combine
        run: python validation-patterns/split_patterns.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: real-patterns-x86_64-pc-windows-msvc-srg
          path: |
            fcupdater/validation-patterns/evidence/x86_64-pc-windows-msvc/results.json
            fcupdater/validation-patterns/evidence/x86_64-pc-windows-msvc/*.profdata
            fcupdater/validation-patterns/evidence/x86_64-pc-windows-msvc/*.exe
          retention-days: 3
