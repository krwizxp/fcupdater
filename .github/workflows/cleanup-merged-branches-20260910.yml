name: Cleanup merged branch and non-main runs
'on':
  push:
    branches:
      - main
    paths:
      - .github/workflows/cleanup-merged-branches-20260910.yml
permissions: {}
jobs:
  cleanup:
    if: github.repository == 'krwizxp/fcupdater' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Remove verified merged branch and reviewed non-main runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          
          REPOSITORY = "krwizxp/fcupdater"
          SOURCE_BRANCH = "tmp/goal-cleanup-20260910"
          SOURCE_SHA = "282fa7bd0534f4d5d7a755fe9d243f4f91e12dc0"
          VALIDATED_CI_ID = 34507741477
          RUNS = [
              {
                  "id": 27997807458,
                  "branch": "codex/platform-clippy-20260623112211",
                  "sha": "929a43063d48aad7001e5686f09e1e87b777816a"
              }
          ]
          
          if os.environ["GITHUB_REPOSITORY"] != REPOSITORY:
              raise RuntimeError("Unexpected repository")
          if os.environ["GITHUB_REF"] != "refs/heads/main":
              raise RuntimeError("Cleanup must run from main")
          
          API_ROOT = "https://api.github.com/repos/" + REPOSITORY
          TOKEN = os.environ["GH_TOKEN"]
          
          def api(method, path, allow_missing=False):
              request = Request(
                  API_ROOT + "/" + path,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": "Bearer " + TOKEN,
                      "X-GitHub-Api-Version": "2026-03-10",
                      "User-Agent": "repository-maintenance",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      data = response.read()
                      if method == "DELETE" and response.status != 204:
                          raise RuntimeError("Unexpected delete response")
                      return json.loads(data) if data else None
              except HTTPError as error:
                  if allow_missing and error.code == 404:
                      return None
                  raise RuntimeError(f"{method} {path} failed with HTTP {error.code}") from None
          
          source_path = "git/ref/heads/" + quote(SOURCE_BRANCH, safe="/")
          main_ref = api("GET", "git/ref/heads/main")
          main_sha = main_ref["object"]["sha"]
          comparison = api("GET", "compare/" + SOURCE_SHA + "..." + main_sha)
          if comparison["merge_base_commit"]["sha"] != SOURCE_SHA or comparison["behind_by"] != 0:
              raise RuntimeError("Source commit is not fully contained in main")
          
          ci = api("GET", f"actions/runs/{VALIDATED_CI_ID}")
          if (
              ci["head_branch"] != "main"
              or ci["head_sha"] != SOURCE_SHA
              or ci["status"] != "completed"
              or ci["conclusion"] != "success"
          ):
              raise RuntimeError("The merged source CI is not successful")
          
          source = api("GET", source_path, allow_missing=True)
          if source is not None and source["object"]["sha"] != SOURCE_SHA:
              raise RuntimeError("Source branch moved; refusing to delete")
          
          # Validate the entire fixed run list before making any changes.
          pending_runs = []
          for expected in RUNS:
              run = api("GET", f"actions/runs/{expected['id']}", allow_missing=True)
              if run is None:
                  continue
              if (
                  expected["branch"] == "main"
                  or run["head_branch"] != expected["branch"]
                  or run["head_sha"] != expected["sha"]
                  or run["status"] != "completed"
              ):
                  raise RuntimeError(f"Run {expected['id']} does not match the reviewed non-main run")
              pending_runs.append(expected)
          
          # Check again immediately before deleting the reviewed branch.
          source = api("GET", source_path, allow_missing=True)
          if source is not None:
              if source["object"]["sha"] != SOURCE_SHA:
                  raise RuntimeError("Source branch moved during preflight; refusing to delete")
              api("DELETE", "git/refs/heads/" + quote(SOURCE_BRANCH, safe="/"))
              print("Deleted merged branch: " + SOURCE_BRANCH, flush=True)
          
          for expected in pending_runs:
              api("DELETE", f"actions/runs/{expected['id']}")
              print(f"Deleted non-main run {expected['id']} ({expected['branch']})", flush=True)
          
          if api("GET", source_path, allow_missing=True) is not None:
              raise RuntimeError("Branch still exists after deletion")
          for expected in RUNS:
              if api("GET", f"actions/runs/{expected['id']}", allow_missing=True) is not None:
                  raise RuntimeError(f"Run {expected['id']} still exists after deletion")
          
          summary = (
              f"Source commit: {SOURCE_SHA}\n\n"
              f"Verified merged branch absent: {SOURCE_BRANCH}\n\n"
              f"Verified non-main runs absent: {len(RUNS)}\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          print(summary, flush=True)
          PY
