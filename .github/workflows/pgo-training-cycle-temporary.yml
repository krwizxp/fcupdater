name: Temporary all-platform PGO retraining
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/pgo-training-cycle-temporary.yml"
      - "src/**"
      - "fuel_cost_chungcheong.xlsx"
permissions:
  contents: write
jobs:
  train:
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: macos-26
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preflight strict actual-endpoint TLS and transport
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            powershell.exe -NoProfile -Command '$r=New-Object -ComObject WinHttp.WinHttpRequest.5.1; $r.SetTimeouts(10000,10000,15000,20000); $r.Open("GET","https://www.opinet.co.kr/user/opdown/opDownload.do",$false); $r.Send(); Write-Output ("WinHTTP HTTPS status "+$r.Status)'
          else
            curl --version | head -2
            curl --silent --show-error --location --connect-timeout 10 --max-time 30 --output /dev/null --write-out "Strict Opinet HTTPS status %{http_code}\n" https://www.opinet.co.kr/user/opdown/opDownload.do
          fi
      - name: Resolve latest stable Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
      - name: Compiler identity
        run: rustc +stable -Vv
      - name: Install Linux native libcurl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Instrument release application and exercise authoritative update
        shell: bash
        env:
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p pgo-raw "$RUNNER_TEMP/fcupdater-trained"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PROFILE_PATH="$(cygpath -m "$PWD/pgo-raw")"
          else
            PROFILE_PATH="$PWD/pgo-raw"
          fi
          export RUSTFLAGS="-Cprofile-generate=$PROFILE_PATH"
          export CARGO_TARGET_DIR=target-profile-training
          cargo +stable build --release --frozen --bin fcupdater --target "$TARGET_TRIPLE"
          BINARY="$PWD/target-profile-training/$TARGET_TRIPLE/release/fcupdater"
          if [ "$RUNNER_OS" = "Windows" ]; then BINARY="$BINARY.exe"; fi
          "$BINARY" --help > "$RUNNER_TEMP/fcupdater-trained/help.txt"
          "$BINARY" --version > "$RUNNER_TEMP/fcupdater-trained/version.txt"
          if "$BINARY" --unknown-option > "$RUNNER_TEMP/fcupdater-trained/rejected.txt" 2>&1; then
            echo "Invalid CLI option unexpectedly succeeded"
            exit 1
          fi
          cp fuel_cost_chungcheong.xlsx "$RUNNER_TEMP/fcupdater-trained/"
          cd "$RUNNER_TEMP/fcupdater-trained"
          "$BINARY" --verify
          cd "$GITHUB_WORKSPACE"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'fcupdater-trained'/'fuel_cost_chungcheong.xlsx'
          ns='{http://schemas.openxmlformats.org/spreadsheetml/2006/main}'
          with ZipFile(p) as z:
              assert z.testzip() is None
              values=[''.join(n.text or '' for n in si.iter(ns+'t')) for si in ET.fromstring(z.read('xl/sharedStrings.xml')).findall(ns+'si')]
              root=ET.fromstring(z.read('xl/worksheets/sheet1.xml'))
              assert len(root.findall('.//'+ns+'row'))>=100
              found=[]
              for row in root.findall('.//'+ns+'row'):
                  cells={c.get('r','').rstrip('0123456789'):c for c in row.findall(ns+'c')}
                  def value(col):
                      c=cells.get(col)
                      if c is None:return None
                      v=c.find(ns+'v')
                      if v is None:return None
                      return values[int(v.text)] if c.get('t')=='s' else v.text
                  if value('C')=='한솔주유소' and value('B')=='대전':
                      found.append((value('F'),value('Q')))
              assert len(found)==1 and found[0][1]=='Y',found
              assert any(c.find(ns+'f') is not None for c in root.findall('.//'+ns+'c'))
              assert 'xl/worksheets/sheet2.xml' in z.namelist()
              print('Validated shared-string flag and ZIP/worksheet CRC:',found, p.stat().st_size)
          PY
          SYSROOT="$(rustc +stable --print sysroot)"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PROFDATA="$(cygpath -u "$SYSROOT")/lib/rustlib/$TARGET_TRIPLE/bin/llvm-profdata.exe"
          else
            PROFDATA="$SYSROOT/lib/rustlib/$TARGET_TRIPLE/bin/llvm-profdata"
          fi
          test -x "$PROFDATA"
          test "$(find pgo-raw -maxdepth 1 -name '*.profraw' | wc -l)" -gt 0
          "$PROFDATA" merge -sparse pgo-raw/*.profraw -o "$TARGET_TRIPLE.profdata"
          "$PROFDATA" show "$TARGET_TRIPLE.profdata" | head -20
          test -s "$TARGET_TRIPLE.profdata"
          sha256sum "$TARGET_TRIPLE.profdata"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: trained-${{ matrix.target }}
          path: ${{ matrix.target }}.profdata
          if-no-files-found: error
          retention-days: 7
  publish-to-validation-branch:
    needs: train
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: trained-*
          merge-multiple: true
          path: pgo
      - name: Commit newly trained profiles on validation branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pgo/*.profdata
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Relearn release PGO profiles on all supported platforms"
            git push origin HEAD:${{ github.head_ref }}
          fi
